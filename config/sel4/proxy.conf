# seL4 appliance configuration (signed into config/sel4/proxy.sconf via scripts/sign-config.sh).
# Inside QEMU user-net, 10.0.2.2 reaches the host loopback where backend servers listen.
listen 0.0.0.0:8443
cert   config/dev/cert.pem
key    config/dev/key.pem
max_conns 64

backend a 10.0.2.2:19001
backend b 10.0.2.2:19002

route GET  /health      health
route POST /api/chat    a max_body=1048576
route GET  /api/models  a
route GET  /api/events  a
route GET  /game/*      b
route POST /game/*      b max_body=65536
